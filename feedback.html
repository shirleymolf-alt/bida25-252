<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shirley's Nail Plug</title>
    <link rel="stylesheet" href="feedback.css">
    <style>
    form {
        width: 100%;
        max-width: 400px;
        margin: auto;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        box-sizing: border-box;
    }
    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }
    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        background-color: #F4C2C2;
        opacity: 39%;
        border: 2px solid #C9A227;
        border-radius: 15px;
        box-sizing: border-box;
    }
    textarea {
        height: 120px;
        resize: none;
    }
    .buttons {
        margin-top: 20px;
        text-align: center;
    }
    button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
    }
    .submit-btn {
        background-color: #EA8F8F;
        color: white;
        border: 3px solid #C9A227;
        border-radius: 15px;
    }
    .clear-btn {
        background-color: #EA8F8F;
        color: white;
        border: 3px solid #C9A227;
        border-radius: 15px;
        margin-right: 10px;
    }
    button:hover { opacity: 0.9; }
    </style>
</head>
<body>
<header>
  <div class="navbar">
    <img src="shirley_nail_logo.png" alt="Logo"/>
    <div class="menu-toggle" id="menuToggle">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <ul id="navMenu">
      <li><a href="index.html">HOME</a></li>
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="services.html">SERVICES</a></li>
      <li><a href="gallery.html">GALLERY</a></li>
      <li><a href="contact.html">CONTACT</a></li>
      <li><a href="feedback.html">FEEDBACK</a></li>
    </ul>
  </div>
</header>

<section>
  <div class="feedback form">
    <form action="acknowledgement_2.html" method="get">
      <div class="title">
        <h3>Tell us what you think</h3>
      </div>
      <label for="name">FULL NAME</label>
      <input type="text" id="name" name="name" required>
      <label for="phone">PHONE NUMBER</label>
      <input type="number" id="phone" name="phone" required>
      <label for="email">EMAIL ADDRESS</label>
      <input type="email" id="email" name="email" required>
      <label for="message">MESSAGE</label>
      <textarea id="message" name="message" required></textarea>
      <div class="buttons">
        <button type="reset" class="clear-btn">Clear</button>
        <button type="submit" class="submit-btn">Submit</button>
      </div>
    </form>
  </div>
</section>

<footer>
  <div class="footer">
    <div class="facebook">
      <img src="facebook.png" alt="Facebook Logo"/>
      <p>Shirley's Nail Plug</p>
    </div>
    <div class="whatsapp">
      <img src="whatsapp.png" alt="WhatsApp Logo"/>
      <p>+267 78 113 715</p>
    </div>
    <div class="copyright">
      <p>&copy; 2026 SHIRLEY'S NAIL PLUG. ALL RIGHTS RESERVED.</p>
    </div>
  </div>
</footer>

<script src="mobile-menu.js"></script>
</body>
</html>
