<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }
        
        section{
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        section::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: url(background.avif);
          background-size: cover;
          background-position: center;
          opacity: 0.6;
          z-index: 0;
}

        .acknowledgment-content{
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
        }

        .acknowledgment-content h1 {
            color: #080808;
            font-family: serif;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .acknowledgment-content p {
            font-family: serif;
            font-size: 18px;
            color: #FFFFFF;
            margin-bottom: 30px;
        }

        .acknowledgment-content a {
            display: inline-block;
            padding: 12px 35px;
            margin-top: 20px;
            text-decoration: none;
            color: #FFFFFF;
            background-color: #E8A282;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            font-family: serif;
            font-size: 16px;
            cursor: pointer;
        }

        .acknowledgment-content a:hover {
            background: color #d4876a; ;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <section>
        <div class="acknowledgment-content">
             <h1>Thank You!</h1>
             <p>Your message has been succesfully submitted.</p>

             <a href="contact.html">Back to Contact Page</a>
    
        </div>
      
    </section>

    
</body>
</html>
